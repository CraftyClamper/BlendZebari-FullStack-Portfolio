<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vault Capture Prompt</title>
    <style>
        body {
            width: 320px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            background-color: #f8f9fa;
            color: #333;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

            .header h3 {
                margin: 0;
                color: #3a0647;
                font-size: 16px;
                font-weight: 700;
            }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #6c757d;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        input, select {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 20px;
            font-size: 13px;
            outline: none;
        }

            input:focus, select:focus {
                border-color: #3a0647;
            }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-save {
            background-color: #3a0647;
            color: white;
        }

        .btn-cancel {
            background-color: #e9ecef;
            color: #495057;
        }

        #status-msg {
            margin-top: 10px;
            font-size: 12px;
            text-align: center;
            font-weight: 500;
        }

        .pin-box {
            text-align: center;
            font-size: 18px;
            letter-spacing: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <span>🔒</span>
        <h3>Secure Bookmarks Vault</h3>
    </div>

    <!-- 1. LOCK SCREEN PANEL -->
    <div id="lock-screen">
        <p style="font-size: 12px; color: #6c757d; text-align: center;">Enter your unique 4-digit account PIN to unlock your vault directories.</p>
        <div class="form-group">
            <input type="password" id="pin-input" class="pin-box" maxlength="4" placeholder="••••">
        </div>
        <button id="btn-unlock" class="btn-save" style="width:100%;">Unlock Vault</button>
    </div>

    <!-- 2. VAULT CONTENT PANEL (Hidden initially) -->
    <div id="vault-content" style="display: none;">
        <div class="form-group">
            <label for="bookmark-title">Webpage Title</label>
            <input type="text" id="bookmark-title">
        </div>
        <div class="form-group">
            <label for="folder-dropdown">Select Target Folder</label>
            <select id="folder-dropdown">
                <option value="">Loading folders...</option>
            </select>
        </div>
        <div class="btn-group">
            <button id="btn-cancel" class="btn-cancel">Cancel</button>
            <button id="btn-save" class="btn-save">Save to Vault</button>
        </div>
    </div>

    <div id="status-msg">Checking browser session...</div>

    <!-- Links our dynamic javascript controller script -->
    <script src="popup.js"></script>

</body>
</html>
